[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskpal"
version = "0.1.0"
description = "Local-first personal agent backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deskpal = "deskpal.application.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

