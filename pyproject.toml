[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskpal"
version = "0.5.0rc1"
description = "Local-first personal agent backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0", "tzdata; sys_platform == 'win32'"]

[project.scripts]
deskpal = "deskpal.application.cli:main"

[project.gui-scripts]
deskpal-gui = "deskpal.gui.main:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "mypy>=1.10"]
screenshot = ["mss>=10.0,<11"]
# Optional local CPU retrieval; prepare the model cache explicitly.
embedding = ["fastembed==0.9.0"]
gui = ["PySide6==6.12.0", "PySide6-Fluent-Widgets==1.11.3", "PySideSix-Frameless-Window==0.8.2", "darkdetect==0.8.0", "pywin32==312; sys_platform == 'win32'"]
gui-dev = ["pytest-qt>=4.5,<4.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"deskpal.gui" = ["assets/pet/*.png", "assets/pet/*.json", "assets/pet/*.md", "assets/avatars/*.png", "assets/studio/*.html", "assets/studio/*.css", "assets/studio/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib"

[tool.mypy]
# 组件库未提供 py.typed；只描述实际使用且与锁定版本核对过的公共接口。
mypy_path = "typings"

