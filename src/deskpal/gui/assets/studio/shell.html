<div id="deskpal-studio" aria-label="Deskpal 清透工作室">
  <div class="ds-layout">
    <nav class="ds-nav" aria-label="主导航">
      <div class="ds-row ds-brand"><div class="ds-brand-mark"><i data-lucide="orbit" aria-hidden="true"></i></div><span>Deskpal</span></div>
      <button data-page="chat" class="active" aria-label="聊天" aria-current="page"><i data-lucide="messages-square" aria-hidden="true"></i><span>聊天</span></button>
      <button data-page="plans" aria-label="安排"><i data-lucide="calendar-days" aria-hidden="true"></i><span>安排</span></button>
      <button data-page="memory" aria-label="记忆"><i data-lucide="book-open" aria-hidden="true"></i><span>记忆</span></button>
      <button data-page="plugins" aria-label="工具与插件"><i data-lucide="blocks" aria-hidden="true"></i><span>工具与插件</span></button>
      <div class="ds-nav-spacer"></div>
      <button data-page="settings" aria-label="设置"><i data-lucide="settings-2" aria-hidden="true"></i><span>设置</span></button>
    </nav>
    <main class="ds-main" id="ds-main"></main>
  </div>
  <div class="ds-overlay" id="ds-overlay" hidden></div>
  <div class="ds-toaster" id="ds-toast" role="status" hidden></div>
</div>
