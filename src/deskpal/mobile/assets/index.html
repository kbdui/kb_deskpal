<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>Deskpal</title>
  <link rel="stylesheet" href="/mobile.css">
  <script src="/mobile.js" defer></script>
</head>
<body>
  <section id="login" class="login" hidden>
    <div class="brand">Deskpal</div><h1>把聊天带在身边</h1>
    <p>在电脑的「设置 → 手机访问」生成配对码。</p>
    <form id="pair-form">
      <label>设备名称<input name="name" autocomplete="off" maxlength="60" value="我的手机" required></label>
      <label>一次性配对码<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" required></label>
      <button class="primary" type="submit">连接 Deskpal</button>
    </form>
  </section>
  <main id="app" hidden>
    <header><span class="brand">Deskpal</span><button id="directory-button" aria-label="切换会话">日常聊天⌄</button><button id="logout">退出</button></header>
    <section id="directory" class="directory" hidden aria-label="会话列表"></section>
    <div id="connection" role="status">正在连接…</div>
    <div class="thread-wrap">
      <section id="thread" tabindex="0" aria-label="聊天记录"><button id="older" hidden>加载更早记录</button><div id="messages"></div></section>
      <button id="bottom" hidden aria-label="回到聊天底部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16m-7-7 7 7 7-7"/></svg></button>
    </div>
    <div id="pending" class="pending" hidden></div>
    <form id="compose">
      <div id="target-row" hidden><label>发送到<select id="target" aria-label="消息用途"></select></label></div>
      <textarea id="input" rows="3" maxlength="20000" aria-label="聊天消息" placeholder="正在读取会话…" disabled></textarea>
      <div class="compose-foot"><span>Enter 发送 · Shift + Enter 换行</span><button id="send" class="primary" type="submit" aria-label="发送" disabled>↑</button></div>
    </form>
  </main>
  <dialog id="detail"><div class="dialog-head"><h2>执行记录</h2><button id="close-detail" aria-label="关闭">×</button></div><div id="detail-body"></div></dialog>
  <div id="notice" role="status" hidden></div>
</body>
</html>
