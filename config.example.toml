# Offline is an explicit deterministic demo, not a real language model.
[llm]
provider = "offline"
# API mode: provider = "openai", model = a model available to your account.
model = ""
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
# Optional Windows Credential Manager reference written by the setup wizard.
# Environment/.env credentials take precedence. Never put the secret in TOML.
credential_ref = ""
timeout_seconds = 30.0
# Explicit opt-in for compatible Responses endpoints. JSON mode guarantees
# JSON syntax only; host envelope and signal validation remain required.
# Planning and ordinary chat/generate retain their existing request format.
expression_output_format = "prompt" # prompt | json_object

[sandbox]
workspace_dir = "workspace"
max_file_bytes = 1048576

[storage]
data_dir = "data"

[agent]
max_tool_steps = 8

[scheduling]
poll_interval_seconds = 1.0

[screenshot]
max_pixels = 16000000

[memory]
# Ordinary chat is not persisted by default. candidate_review opts into extraction.
mode = "explicit_only"
# Optional CPU model: install requirements-embedding.txt and download/cache explicitly.
embedding_provider = "disabled"
model_cache_dir = "data/models/fastembed"
max_context_bytes = 8000
max_candidates = 5
semantic_threshold = 0.55
evaluation_timeout_seconds = 15.0
evaluation_max_output_tokens = 2048

[workflow]
# Positive limits: queue <=10000; payloads <=16 MiB; shutdown <=60 seconds.
queue_capacity = 100
request_max_bytes = 65536
plan_max_bytes = 262144
result_max_bytes = 262144
shutdown_timeout_seconds = 5.0

[proactive]
# Local deterministic proposals only; enabling this grants no execution or cloud permission.
enabled = false
# Positive limits: polling <=60s; batch <=100; new proposals <=10; TTL <=30 days.
poll_interval_seconds = 1.0
event_batch_size = 100
max_proposals_per_poll = 10
proposal_ttl_seconds = 86400
quiet_start = "22:00"
quiet_end = "08:00"
timezone = "Asia/Shanghai"

